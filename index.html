  sun: `

const toast=(msg)=>{const old=$('toast');if(old)old.remove();const el=document.createElement('div');el.className='toast';el.id='toast';el.textContent=msg;document.body.append(el);setTimeout(()=>el.remove(),2800);};
const safeSound=(freq=700)=>{if(!data.prefs.sound)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=new C();const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.11,ctx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.16);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.18);o.onended=()=>ctx.close();}catch(e){}};

const questionCard=(q, quiz)=>{const order=quiz.orders[quiz.idx],ans=quiz.answers[quiz.idx]||{},isExam=quiz.mode==='exam', locked=!isExam&&['correct','retrycorrect','learn','retrywrong'].includes(ans.phase), retry=ans.phase==='retry';return `<section class="question-panel"><div class="question-eyebrow">${q.unit==='sun'?'1-1':planet(q.unit).unit} · ${E(q.concept)}　 ${E(q.difficulty)}題</div><h2 class="question-text">${E(q.text)}</h2><div class="choices">${order.map((choice,i)=>{const state=locked?(choice===q.correct?'correct':choice===ans.selected?'wrong':''):'';return `<button class="choice ${state}" ${locked?'disabled':''} onclick="game.answer(${i})"><span class="choice-letter">${'ABCD'[i]}</span>${E(choice)}</button>`;}).join('')}</div>${retry?'<div class="hint">💡 提示：先想想題目中的關鍵概念，再比較各選項。</div>':''}</section>`;};
const quizPage=()=>{const x=ui.quiz;if(!x)return `<div class="empty">沒有進行中的挑戰。${btn('回首頁',"go('home')")}</div>`;const isExam=x.mode==='exam';const q=qIndex[x.ids[x.idx]];const p=planet(x.unit||'sun');const progress=Math.round(x.idx/x.ids.length*100);const h=isExam?'📝 段考模擬測驗':x.mode==='boss'?`🐉 ${x.boss==='solar'?'光影混亂獸':'森林混亂獸'}`:x.mode==='wrong'?'🎯 錯題特訓':`${p.emoji} ${p.name}｜${stageLabel(x.mode)}`;const ans=x.answers[x.idx]||{};if(!q)return `<div class="page">${pageHeading('FINISH','✅ 題目已完成','請交卷或結束任務。')}${btn(isExam?'交卷並查看成績':'完成挑戰',isExam?'submitExam()':'finishQuiz()')}</div>`;

function labSvgSun(l){const angle=Number(l.angle||30),dir=l.direction||'東方',sunX=dir==='東方'?102:dir==='西方'?428:270,sunY=240-angle*2.45;const shadowLength=Math.min(205,Math.round(120/Math.tan(angle*Math.PI/180)));const shadowDX=dir==='東方'?shadowLength:dir==='西方'?-shadowLength:-Math.round(shadowLength*.55);const shadowDY=dir==='南方'?Math.round(shadowLength*.34):12;return `<svg viewBox="0 0 540 315" role="img" aria-label="太陽高度角${angle}度，方位${dir}，影子長短模擬圖"><defs><linearGradient id="sunSky" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#77bcff"/><stop offset="1" stop-color="#e4f6ff"/></linearGradient></defs><rect width="540" height="315" rx="20" fill="url(#sunSky)"/><circle cx="${sunX}" cy="${sunY}" r="31" fill="#ffd041" stroke="#fff6b7" stroke-width="6"/><path d="M0 242 H540 V315 H0Z" fill="#76c897"/><ellipse cx="270" cy="247" rx="170" ry="18" fill="#438e64" opacity=".25"/><path d="M270 243 L${270+shadowDX} ${243+shadowDY}" stroke="#3c4c61" stroke-width="24" opacity=".5" stroke-linecap="round"/><path d="M270 242 V126" stroke="#775340" stroke-width="19" stroke-linecap="round"/><path d="M270 154 L303 169 L270 182Z" fill="#ff658b"/><text x="22" y="30" font-size="18" font-weight="800" fill="#13416d">太陽：${dir} / 高度角 ${angle}°</text><text x="24" y="296" font-size="17" fill="#13416d">影子：${angle>=60?'較短':angle>=35?'中等':'較長'}，朝${({東方:'西方',西方:'東方',南方:'北方'})[dir]}</text><text x="420" y="45" font-size="17" fill="#1f6092">☀️ 安全觀測</text></svg>`;}
function labSvgLight(l){const deg=Number(l.angle||35),a=deg*Math.PI/180,ref=Math.asin(Math.sin(a)/1.33),x=270,y=155,startX=x-132*Math.sin(a),startY=y-132*Math.cos(a),endX=x+130*Math.sin(ref),endY=y+130*Math.cos(ref);return `<svg viewBox="0 0 540 310" role="img" aria-label="光從空氣進入水的折射模擬"><defs><linearGradient id="lightWater" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#a0e6ff"/><stop offset="1" stop-color="#43a3e3"/></linearGradient></defs><rect width="540" height="310" rx="20" fill="#e8f8ff"/><path d="M0 155 H540 V310 H0Z" fill="url(#lightWater)"/><line x1="0" y1="155" x2="540" y2="155" stroke="#3899c9" stroke-width="4"/><line x1="270" y1="20" x2="270" y2="300" stroke="#668bb2" stroke-dasharray="9 9" stroke-width="2"/><path d="M${startX} ${startY} L270 155 L${endX} ${endY}" fill="none" stroke="#ff6564" stroke-width="7" stroke-linecap="round"/><circle cx="270" cy="155" r="8" fill="#fff" stroke="#fa6c72" stroke-width="3"/><text x="24" y="31" fill="#225c88" font-weight="800" font-size="21">空氣</text><text x="24" y="190" fill="#134476" font-weight="800" font-size="21">水</text><text x="300" y="78" fill="#25598b" font-size="18">入射角 ${deg}°</text><text x="300" y="240" fill="#104775" font-size="18">折射角 ${Math.round(ref*180/Math.PI)}°</text><text x="282" y="28" fill="#3f6a8d" font-size="15">法線</text></svg>`;}
function labContent(l){const p=planet(ui.unit);let visual='',controls='',question='',explanation='';
if(p.id==='sun'){visual=labSvgSun(l);controls=`<label for="angleSun">☀️ 調整太陽高度角：<b>${l.angle}°</b></label><input id="angleSun" type="range" min="15" max="75" step="5" value="${l.angle}" oninput="game.labAngle(this.value)"/><div style="width:100%" class="sketch-w">選擇太陽方位：</div>${['東方','南方','西方'].map(d=>`<button class="lab-option ${l.direction===d?'active':''}" onclick="game.labDirection('${d}')">${d}</button>`).join('')}`;question='🎯 任務：當太陽位於東方時，影子會朝哪個方向？';explanation='太陽高度角愈高，影子通常愈短；影子方向與太陽方位相反。';}

const labPage=()=>{const l=ui.lab||{angle:30,direction:'東方',sequence:[],matches:[]},p=planet(ui.unit),c=labContent(l);return `<div class="page">${pageHeading('INTERACTIVE SCIENCE LAB',`🔬 ${p.name}・科學實驗室`,'動手操作、觀察現象，再用自己的知識完成任務。')}<section class="glass panel"><div class="info-line"><span class="pill">${p.unit} ${p.subtitle}</span><span class="pill">安全互動模擬</span></div><div class="lab-stage">${c.visual}<div class="lab-controls">${c.controls}</div></div><p class="lab-note">💡 本頁為教學用模擬，協助理解原理；實際觀測仍受環境與器材條件影響。太陽及放大鏡實驗切勿直視太陽。</p><div class="dialog"><strong>${c.question}</strong>${p.id==='sun'||p.id==='light'?`<p class="lead">${l.interacted?'已完成操作，可以檢查你的觀察！':'請先調整滑桿或太陽方位，觀察變化。'}</p><div class="btnrow">${(p.id==='sun'?['西方','東方','北方']:['靠近法線','遠離法線','沒有改變']).map((a,i)=>btn(a,`labAnswer(${i})`,'small secondary')).join('')}</div>`:''}${l.message?`<div class="dialog ${l.solved?'success':'danger'}" role="status">${E(l.message)}</div>`:''}${l.solved?`<div class="notice">📖 <b>科學小結：</b>${E(c.explanation)}</div><div class="btnrow">${btn('✅ 領取實驗獎勵','completeLab()')}</div>`:''}</div><div class="btnrow">${btn('← 回星球任務',`openPlanet('${p.id}')`,'secondary')}</div></section>${footer()}</div>`;};
const examSetup=()=>`<div class="page">${pageHeading('EXAM CHALLENGE','🏆 段考模擬中心','從五個活動抽取原創題目，採首次作答計分，交卷後才公布解析。')}<div class="grid two"><button class="tile" onclick="game.examCount(15)" style="border-color:${ui.examCount===15?'#ffe68d':''}"><span class="emoji">⚡</span><strong>快速挑戰・15 題</strong><small>約 10～15 分鐘</small></button><button class="tile" onclick="game.examCount(30)" style="border-color:${ui.examCount===30?'#ffe68d':''}"><span class="emoji">🏆</span><strong>完整挑戰・30 題</strong><small>約 25～30 分鐘</small></button></div><section class="glass panel" style="margin-top:18px"><h2>🎯 測驗規則</h2><p class="lead">共 ${ui.examCount} 題，五個活動平均抽題，同場不重複，題目順序與選項順序皆會重新排列。</p><label class="switch-row">顯示計時（不強制交卷） <input type="checkbox" ${ui.examTimer?'checked':''} onchange="game.examTimer(this.checked)"></label><div class="notice">考試過程不提供答案與提示。答題選項按下後立即進入下一題，不能返回修改。若離開可由首頁繼續，但同一場考試不會因重整而重抽題目。</div><div class="btnrow">${btn('🚀 開始 '+ui.examCount+' 題模擬考','startExam()')}</div></section>${data.exams.length?section('🗂️ 最近測驗',data.exams.slice(-5).reverse().map(ex=>`<div class="item-row"><div><div class="title">${ex.count} 題模擬考</div><small>${new Date(ex.date).toLocaleString('zh-TW')}</small></div><div><b>${ex.score} 分</b><small>${ex.correct}/${ex.count} 題</small></div></div>`).join('')):''}${footer()}</div>`;
function weakness(){const map=new Map();for(const r of data.records){const key=r.unit+':'+r.concept;const z=map.get(key)||{unit:r.unit,concept:r.concept,total:0,wrong:0};z.total++;if(!r.correct)z.wrong++;map.set(key,z);}return [...map.values()].filter(x=>x.wrong>0).sort((a,b)=>b.wrong/(b.total||1)-a.wrong/(a.total||1)||b.wrong-a.wrong);}
const wrongPage=()=>{const w=weakness(),wrongRecords=data.records.filter(r=>!r.correct),unique=[...new Set(w.map(x=>x.unit+':'+x.concept))];const filters=['all',...PLANETS.map(p=>p.id)];const ww=w.filter(x=>ui.wrongFilter==='all'||ui.wrongFilter===x.unit);return `<div class="page">${pageHeading('RETRY & LEARN','🎯 錯題修練場','答錯不是失敗，而是發現了可以進步的地方。')}<div class="grid two"><div class="glass report-card"><div class="big-num">${wrongRecords.length}</div><div class="muted">累計首次答錯題次</div></div><div class="glass report-card"><div class="big-num">${unique.length}</div><div class="muted">曾答錯的知識點</div></div></div><section class="glass panel" style="margin-top:18px"><h2>🔁 加強練習</h2><p class="lead">從曾經答錯的知識點中優先抽取不同題目，透過變化題確認理解，而不是單純背選項。</p><div class="btnrow">${btn('開始錯題特訓（最多 10 題）','startWrong()',wrongRecords.length?'':'secondary')}</div>${wrongRecords.length===0?'<p class="notice">還沒有錯題，完成星球任務後就會自動建立複習清單。</p>':''}</section><section class="glass panel" style="margin-top:18px"><h2>🔎 待加強知識點</h2><select class="selector" onchange="game.wrongFilter(this.value)" aria-label="依活動篩選"><option value="all">全部活動</option>${PLANETS.map(p=>`<option value="${p.id}" ${ui.wrongFilter===p.id?'selected':''}>${p.unit} ${p.name}</option>`).join('')}</select>${ww.length?ww.slice(0,25).map(x=>`<div class="item-row"><div><div class="title">${planet(x.unit).emoji} ${E(x.concept)}</div><small>${planet(x.unit).unit}・練習 ${x.total} 題次</small></div><span class="pill warn">需加強 ${x.wrong} 次</span></div>`).join(''):'<div class="empty"><div class="emoji">🌟</div>目前沒有待加強的知識點！</div>'}</section>${footer()}</div>`;};
const reportPage=()=>{const overall=stats(data.records);const w=weakness();return `<div class="page">${pageHeading('PARENT DASHBOARD','📊 家長學習戰情室','分析首次作答表現，與提示後重試成績分開統計，找出真正需要補強的概念。')}<div class="grid"><div class="glass report-card"><div class="big-num">${overall.total?overall.percent+'%':'—'}</div><div class="muted">首次作答正確率</div><div class="fine">${overall.total} 題次</div></div><div class="glass report-card"><div class="big-num">${totalCleared()}/5</div><div class="muted">已完成星球</div></div><div class="glass report-card"><div class="big-num">${data.exams.length}</div><div class="muted">已完成模擬考</div></div></div>${section('📈 各活動首次作答正確率',PLANETS.map(p=>{const s=stats(unitRecords(p.id));return `<div class="bar-row"><header><b>${p.emoji} ${p.unit} ${p.subtitle}</b><span>${s.total?s.percent+'%':'尚無資料'} <small>（${s.total} 題次）</small></span></header>${bar(s.percent)}</div>`;}).join('')+'<p class="fine">正確率統計為首次作答紀錄；重試答對不會改寫最初結果，包含一般練習與測驗。</p>')}${section('🧠 建議複習的知識點',w.length?w.slice(0,6).map(x=>`<div class="item-row"><div><b>${planet(x.unit).unit} ${E(x.concept)}</b><small>答錯 ${x.wrong} 次／練習 ${x.total} 題次</small></div><span class="pill warn">優先複習</span></div>`).join('')+`<div class="btnrow">${btn('進行錯題特訓',"go('wrong')",'secondary')}</div>`:'<div class="empty">目前尚無錯題。先去探索第一顆星球吧！</div>')}${section('🏆 模擬考紀錄',data.exams.length?data.exams.slice(-10).reverse().map(ex=>`<div class="item-row"><div><b>${ex.count} 題模擬考</b><small>${new Date(ex.date).toLocaleString('zh-TW')}</small></div><div><b style="font-size:22px">${ex.score} 分</b><small>${ex.correct}/${ex.count} 題</small></div></div>`).join(''):'<p class="lead">尚未完成模擬考，可先進行 15 題快速測驗。</p>')}${section('🗃️ 學習資料',`<p class="lead">資料保存在目前瀏覽器內，不會自動傳到另一台裝置。建議定期備份，尤其在清除瀏覽器資料前。</p><div class="btnrow">${btn('匯出 JSON 備份','backup()','secondary')}${btn('遊戲設定',"go('settings')",'ghost')}</div>`)}${footer()}</div>`;};
const settingsPage=()=>`<div class="page">${pageHeading('GAME SETTINGS','⚙️ 遊戲設定','調整操作方式、資料備份和遊戲體驗。')}<section class="glass panel"><h2>🧑‍🚀 我的探險家</h2><label class="form-label" for="newName">玩家暱稱</label><input class="field" id="newName" maxlength="14" value="${pName()}"/><div class="avatar-picks">${['🧑‍🚀','👩‍🚀','🦊','🐱'].map(a=>`<button class="avatarpick ${data.avatar===a?'selected':''}" onclick="game.setAvatar('${a}')">${a}</button>`).join('')}</div>${btn('儲存暱稱','updateName()','small secondary')}</section><section class="glass panel" style="margin-top:18px"><h2>🎮 遊戲體驗</h2><label class="switch-row">啟用簡單音效 <input type="checkbox" ${data.prefs.sound?'checked':''} onchange="game.setting('sound',this.checked)"></label><label class="switch-row">顯示簡短動畫 <input type="checkbox" ${data.prefs.motion?'checked':''} onchange="game.setting('motion',this.checked)"></label><label class="form-label" for="wrongMode">答錯題目時預設方式</label><select id="wrongMode" class="selector" style="width:100%" onchange="game.setting('wrongMode',this.value)"><option value="ask" ${data.prefs.wrongMode==='ask'?'selected':''}>每次讓孩子自行選擇（推薦）</option><option value="retry" ${data.prefs.wrongMode==='retry'?'selected':''}>優先提示並立即重試</option><option value="learn" ${data.prefs.wrongMode==='learn'?'selected':''}>優先顯示解析、稍後練習</option></select><p class="fine">提示與學習兩種引導模式始終可在設定中切換。</p></section><section class="glass panel" style="margin-top:18px"><h2>💾 資料保存</h2><div class="btnrow">${btn('⬇️ 匯出學習備份','backup()','secondary')}<label class="btn secondary" for="backupFile" style="cursor:pointer">⬆️ 匯入備份 JSON</label><input id="backupFile" type="file" accept="application/json,.json" style="display:none" onchange="game.importFile(this.files[0])" /></div><p class="lead">備份包含玩家進度、答題紀錄和測驗結果。匯入會覆蓋目前的學習資料。</p><div class="btnrow">${btn('🗑️ 清除全部遊戲資料','resetData()','danger')}</div></section>${section('📌 版本資訊',`<p class="lead">科學星際探險隊 V${APP_VERSION}　・原創題庫 ${allQ.length} 題（每個活動 30 題）・五個互動實驗・本機單人模式。</p><p class="fine">首次以 HTTPS 網站成功載入完整資源後，可透過 PWA 離線使用。直接開啟單檔 HTML 也可試玩，但無 PWA 安裝／服務工作者功能。</p>`)}${footer()}</div>`;
const rewardPage=()=>{const s=ui.summary;if(!s)return home();const exam=s.mode==='exam',lab=s.mode==='lab';const title=exam?'段考模擬完成！':lab?'實驗任務達成！':s.mode==='boss'?(s.passed?'魔王成功擊退！':'魔王仍在等待挑戰！'):'星球任務完成！';const descr=lab?'完成互動科學實驗，獲得新的探險能量！':`首次作答：${s.correct} / ${s.count} 題正確（${Math.round(s.correct/s.count*100)}%）`;const starRate=lab?3:s.correct/s.count>=.9?3:s.correct/s.count>=.65?2:1;return `<div class="page">${pageHeading('MISSION RESULT','🏆 冒險結算','把學會的自然科學知識帶往下一顆星球！')}<div class="reward"><span class="trophy">${s.mode==='boss'&&!s.passed?'🤖':'🏆'}</span><h2>${title}</h2><p class="starset">${'★'.repeat(starRate)}${'☆'.repeat(3-starRate)}</p><p class="breathe">${descr}</p>${s.xp?`<span class="pill good">✨ +${s.xp} XP</span> <span class="pill">⭐ +${s.coins||0} 金幣</span>`:''}${s.mode==='boss'&&!s.passed?'<p class="lead">本場未達 60%，複習錯題後可以再挑戰。</p>':''}<div class="btnrow" style="justify-content:center">${btn('🪐 返回星際地圖',"go('map')")}${btn('🎯 查看錯題',"go('wrong')",'secondary')}${btn('📊 學習報告',"go('report')",'ghost')}</div></div>${footer()}</div>`;};
const pages={welcome,home,map,planet:planetPage,quiz:quizPage,lab:labPage,examsetup:examSetup,wrong:wrongPage,report:reportPage,settings:settingsPage,reward:rewardPage};
function render(){document.body.classList.toggle('reduced-motion',!data.prefs.motion);if(!pages[ui.page])ui.page='home';$('app').innerHTML=header()+pages[ui.page]()+((ui.page==='welcome')?'':nav());if(ui.page==='quiz'&&ui.quiz&&ui.quiz.mode==='exam'&&ui.quiz.timer)updateTimer();}
function startGame(){const name=$('playerName')?.value.trim()||'小小科學家';data.name=name.slice(0,14);save();go('home');toast('🚀 歡迎加入科學星際探險隊！');}
function setAvatar(a){if(!['🧑‍🚀','👩‍🚀','🦊','🐱'].includes(a))return;data.avatar=a;save();render();}
function openPlanet(unit){if(!QUESTION_BANK[unit])return;ui.unit=unit;ui.quiz=null;ui.lab=null;go('planet');}
function startStage(unit,mode){if(!QUESTION_BANK[unit]||!['supply','defend'].includes(mode))return;ui.unit=unit;const bank=QUESTION_BANK[unit];let qs=bank.filter(q=>mode==='supply'?q.difficulty==='基礎':q.difficulty!=='基礎');if(qs.length<5)qs=bank;startQuiz(mode,rand(qs).slice(0,5),unit);}
function startBoss(which){if(!['solar','forest'].includes(which))return;const units=which==='solar'?['sun','light']:['plant','flower','green'];if(!units.every(unitCleared)){toast('🔐 請先完成這個星系全部星球的三階段任務！');return;}let q=[];for(const u of units)q.push(...rand(QUESTION_BANK[u]).slice(0,which==='solar'?5:3));if(which==='forest')q.push(...rand(QUESTION_BANK[rand(units)[0]]).slice(0,1));q=rand(q);startQuiz('boss',q,units[0],{boss:which});}
function startQuiz(mode,qs,unit,extra={}){ui.quiz={mode,unit,boss:extra.boss||null,ids:qs.map(q=>q.id),orders:qs.map(q=>rand(q.choices)),idx:0,correctCount:0,answers:{},started:Date.now(),timer:!!extra.timer};ui.summary=null;go('quiz');}
function record(q,correct,mode,extra={}){data.records.push({id:q.id,unit:q.unit,concept:q.concept,correct:!!correct,mode,date:Date.now(),...extra});if(data.records.length>4500)data.records=data.records.slice(-4500);}
function answer(i){const x=ui.quiz;if(!x||x.idx>=x.ids.length)return;const q=qIndex[x.ids[x.idx]],a=x.answers[x.idx]||{},choice=x.orders[x.idx][i];if(choice==null)return;
if(x.mode==='exam'){if(a.phase)return;const correct=choice===q.correct;x.answers[x.idx]={phase:'submitted',selected:choice,initialCorrect:correct};if(correct)x.correctCount++;x.idx++;save();render();return;}
if(['correct','retrycorrect','retrywrong','learn'].includes(a.phase))return;
if(a.phase==='retry'){a.selected=choice;a.retryCorrect=choice===q.correct;a.phase=a.retryCorrect?'retrycorrect':'retrywrong';safeSound(a.retryCorrect?820:280);x.answers[x.idx]=a;save();render();return;}
if(a.phase)return;
const correct=choice===q.correct;x.answers[x.idx]={phase:correct?'correct':'wrong',selected:choice,initialCorrect:correct};record(q,correct,x.mode);if(correct){x.correctCount++;safeSound(850);}else safeSound(250);
if(!correct&&data.prefs.wrongMode==='retry'){x.answers[x.idx].phase='retry';}else if(!correct&&data.prefs.wrongMode==='learn'){x.answers[x.idx].phase='learn';}
save();render();}
function retryAnswer(){const x=ui.quiz,a=x?.answers[x.idx];if(a&&a.phase==='wrong'){a.phase='retry';save();render();}}
function learnAnswer(){const x=ui.quiz,a=x?.answers[x.idx];if(a&&a.phase==='wrong'){a.phase='learn';save();render();}}
function nextQuestion(){const x=ui.quiz;if(!x)return;const a=x.answers[x.idx];if(!a||!['correct','retrycorrect','retrywrong','learn'].includes(a.phase))return;if(x.idx<x.ids.length-1){x.idx++;save();render();window.scrollTo(0,0);}else finishQuiz();}
function finishQuiz(){const x=ui.quiz;if(!x)return;let xp=0,coins=0;const once=(key)=>{if(!data.stages[key])data.stages[key]={};};if(x.mode==='supply'||x.mode==='defend'){once(x.unit);if(!data.stages[x.unit][x.mode]){data.stages[x.unit][x.mode]=true;xp=45+x.correctCount*6;coins=25;}}
if(x.mode==='boss'){const pass=x.correctCount/x.ids.length>=.6;if(pass&&!data.bosses[x.boss]){data.bosses[x.boss]=true;xp=160;coins=70;}}
if(x.mode==='wrong'){xp=x.correctCount*3;coins=0;}
data.xp+=xp;data.coins+=coins;ui.summary={mode:x.mode,passed:x.mode==='boss'?x.correctCount/x.ids.length>=.6:true,correct:x.correctCount,count:x.ids.length,xp,coins};ui.quiz=null;save();go('reward');}
function examCount(n){ui.examCount=n===30?30:15;save();render();}
function examTimer(v){ui.examTimer=!!v;save();render();}
function startExam(){const n=ui.examCount;const count=n/5;let qs=[];for(const p of PLANETS)qs.push(...rand(QUESTION_BANK[p.id]).slice(0,count));startQuiz('exam',rand(qs),'sun',{timer:ui.examTimer});}
function updateTimer(){const x=ui.quiz;if(!x||x.mode!=='exam'||!x.timer)return;const el=$('examTimer');if(!el)return;const secs=Math.floor((Date.now()-x.started)/1000);el.textContent=`${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`;}
function submitExam(){const x=ui.quiz;if(!x||x.mode!=='exam')return;const count=x.ids.length;if(x.idx<count&&!confirm(`還有 ${count-x.idx} 題未作答，確定要交卷嗎？未作答題目以錯誤計分。`))return;for(let i=0;i<x.ids.length;i++){const q=qIndex[x.ids[i]],a=x.answers[i];record(q,!!(a&&a.initialCorrect),'exam');}const correct=x.correctCount,score=Math.round(correct/count*100);data.exams.push({date:Date.now(),count,correct,score,seconds:Math.round((Date.now()-x.started)/1000)});if(data.exams.length>100)data.exams=data.exams.slice(-100);const xp=Math.round(correct*4);data.xp+=xp;ui.summary={mode:'exam',correct,count,xp,coins:0,passed:true};ui.quiz=null;save();go('reward');}
function resumeQuiz(){if(ui.quiz){go('quiz');return;}go('map');}
function startWrong(){const wrong=data.records.filter(r=>!r.correct);if(!wrong.length){toast('目前還沒有錯題，先挑戰星球任務吧！');return;}const last=rand(wrong.slice(-100));const chosen=[],used=new Set();for(const r of last){const similar=QUESTION_BANK[r.unit].filter(q=>q.concept===r.concept&&q.id!==r.id&&!used.has(q.id));const candidate=rand(similar)[0]||qIndex[r.id];if(candidate&&!used.has(candidate.id)){chosen.push(candidate);used.add(candidate.id);}if(chosen.length===10)break;}startQuiz('wrong',chosen,'sun');}
function wrongFilter(u){ui.wrongFilter=u;render();}
function startLab(unit){if(!QUESTION_BANK[unit])return;ui.unit=unit;ui.lab={angle:30,direction:'東方',sequence:[],matches:[],selected:'',interacted:false,solved:false,message:''};go('lab');}
function labAngle(v){const l=ui.lab;if(!l||l.solved)return;l.angle=Math.max(ui.unit==='light'?10:15,Math.min(ui.unit==='light'?70:75,Number(v)||30));l.interacted=true;save();render();}
function labDirection(d){const l=ui.lab;if(!l||l.solved||!['東方','南方','西方'].includes(d))return;l.direction=d;l.interacted=true;save();render();}
function labAnswer(i){const l=ui.lab;if(!l||l.solved||!['sun','light'].includes(ui.unit))return;if(!l.interacted){l.message='請先動手調整條件，看看畫面如何變化喔！';render();return;}if(ui.unit==='sun'&&l.direction!=='東方'){l.message='請先將太陽移到東方，再觀察影子朝向。';render();return;}if(i===0){l.solved=true;l.message='✨ 答對了！你已完成這個科學觀察任務！';safeSound(900);}else{l.message='再觀察看看！可以重新調整太陽的位置或光線角度，想想真正的方向。';safeSound(250);}save();render();}
function labToken(v){const l=ui.lab;if(!l||l.solved||!['plant','flower'].includes(ui.unit))return;const desired=ui.unit==='plant'?['根','莖','葉']:['花藥產生花粉','花粉到柱頭','受精','果實與種子'];if(l.sequence.length>=desired.length)return;if(v===desired[l.sequence.length]){l.sequence.push(v);l.message='✅ 這一步正確，繼續下一步！';safeSound(770);if(l.sequence.length===desired.length){l.solved=true;l.message='🌟 全部排列正確！你完成了實驗任務。';safeSound(980);}}else{l.message='還不是這個步驟喔！想想最先發生的是什麼。';safeSound(230);}save();render();}
function labReset(){if(!ui.lab)return;ui.lab.sequence=[];ui.lab.matches=[];ui.lab.selected='';ui.lab.message='已重新排列，來試試看！';ui.lab.solved=false;save();render();}
function labSelect(v){const l=ui.lab;if(!l||l.solved||ui.unit!=='green')return;if(!['蒼耳','荷葉','棉花'].includes(v))return;if(l.matches.some(m=>m[0]===v)){l.message='這個植物已經配對成功了！';}else{l.selected=v;l.message=`已選擇「${v}」，再點選相對應的生活應用。`;}save();render();}
function labMatch(v){const l=ui.lab;if(!l||l.solved||ui.unit!=='green')return;if(!l.selected){l.message='先選擇上方的一種植物。';render();return;}const correct={'蒼耳':'魔鬼氈','荷葉':'防水自潔','棉花':'纖維布料'};if(correct[l.selected]===v){l.matches.push([l.selected,v]);l.message='✨ 配對成功！';l.selected='';safeSound(810);if(l.matches.length===3){l.solved=true;l.message='🎉 3 組配對全對！植物科技任務完成！';}}else{l.message='還不是這組喔！想想植物外觀與實際用途的關係。';safeSound(230);}save();render();}
function completeLab(){const l=ui.lab;if(!l||!l.solved)return;let xp=0,coins=0;if(!data.stages[ui.unit])data.stages[ui.unit]={};if(!data.stages[ui.unit].lab){data.stages[ui.unit].lab=true;xp=80;coins=30;data.xp+=xp;data.coins+=coins;}ui.summary={mode:'lab',correct:1,count:1,xp,coins,passed:true};ui.lab=null;save();go('reward');}
function updateName(){const v=$('newName')?.value.trim();if(!v){toast('請輸入玩家暱稱');return;}data.name=v.slice(0,14);save();render();toast('暱稱已儲存');}
function setting(k,v){if(!['sound','motion','wrongMode'].includes(k))return;if(k==='wrongMode'&&!['ask','retry','learn'].includes(v))return;data.prefs[k]=v;save();render();}
function backup(){const body=JSON.stringify({app:'科學星際探險隊',version:APP_VERSION,exported:new Date().toISOString(),data},null,2);const blob=new Blob([body],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='科學星際探險隊_學習備份_'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('已產生學習資料備份');}
async function importFile(file){if(!file)return;if(file.size>5*1024*1024){toast('檔案超過 5MB，請檢查是否正確');return;}try{const parsed=JSON.parse(await file.text());const d=parsed.data;if(parsed.app!=='科學星際探險隊'||!d||typeof d!=='object'||!Array.isArray(d.records)||!Array.isArray(d.exams)||typeof d.stages!=='object'){toast('不是有效的遊戲備份檔');return;}if(!confirm('匯入會覆蓋目前這台裝置的遊戲與學習紀錄。確定匯入嗎？'))return;const fresh=blank();data={...fresh,name:String(d.name||'小小科學家').slice(0,14),avatar:['🧑‍🚀','👩‍🚀','🦊','🐱'].includes(d.avatar)?d.avatar:fresh.avatar,xp:Math.max(0,Number(d.xp)||0),coins:Math.max(0,Number(d.coins)||0),stages:d.stages||{},bosses:d.bosses||{},records:d.records.filter(r=>r&&qIndex[r.id]&&typeof r.correct==='boolean').slice(-4500),exams:d.exams.filter(e=>e&&Number.isFinite(e.score)).slice(-100),prefs:{...fresh.prefs,...d.prefs}};ui={page:'home',unit:'sun',quiz:null,lab:null,summary:null,examCount:15,examTimer:false,reportTab:'overview',wrongFilter:'all'};save();render();toast('✅ 備份匯入成功！');}catch(e){toast('檔案無法解析，請確認是 JSON 備份');}}
function resetData(){if(!confirm('真的要清除所有遊戲進度、錯題及模擬考紀錄嗎？此操作無法還原，建議先備份。'))return;if(!confirm('最後確認：確定要重置整個科學星際探險隊？'))return;data=blank();ui={page:'welcome',unit:'sun',quiz:null,lab:null,summary:null,examCount:15,examTimer:false,reportTab:'overview',wrongFilter:'all'};try{localStorage.removeItem(KEY);localStorage.removeItem(KEY+'-session');sessionStorage.removeItem(KEY+'-session');}catch(e){}render();toast('遊戲資料已重置');}
window.game={go,startGame,setAvatar,openPlanet,startStage,startBoss,startQuiz,answer,retryAnswer,learnAnswer,nextQuestion,finishQuiz,startExam,examCount,examTimer,submitExam,resumeQuiz,startWrong,wrongFilter,startLab,labAngle,labDirection,labAnswer,labToken,labReset,labSelect,labMatch,completeLab,updateName,setting,backup,importFile,resetData};
setInterval(()=>{if(ui.page==='quiz'&&ui.quiz?.mode==='exam'&&ui.quiz.timer)updateTimer();},1000);
render();
if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol)&&location.hostname!=='localhost'&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
else if('serviceWorker'in navigator&&location.hostname==='localhost')navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();

</script>
